<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FISHTO social thumbnail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #F5F5F7;
    color: #1D1D1F;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow {
    position: absolute; width: 900px; height: 900px; border-radius: 980px;
    right: -300px; top: -240px;
    background: radial-gradient(closest-side, rgba(41,151,255,0.24), rgba(41,151,255,0));
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; padding: 0 88px; gap: 56px; }
  .copy { flex: 1; }
  .wordmark { height: 72px; display: block; margin-bottom: 44px; }
  h1 { font-size: 76px; line-height: 1.05; font-weight: 600; letter-spacing: -2.2px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #0066CC, #2997FF); -webkit-background-clip: text; color: transparent; }
  p { margin-top: 22px; font-size: 27px; line-height: 1.3; color: #6E6E73; letter-spacing: -0.3px; }
  .row { margin-top: 36px; display: flex; align-items: center; gap: 24px; }
  .pill { background: #0071E3; color: #FFFFFF; font-size: 24px; font-weight: 600; padding: 14px 32px; border-radius: 980px; }
  .since { font-size: 22px; color: #6E6E73; }
  .icon { width: 340px; height: 340px; flex-shrink: 0; filter: drop-shadow(0 30px 50px rgba(0,102,204,0.35)); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="copy">
      <img class="wordmark" src="../frontend/public/logo.svg" alt="FISHTO" />
      <h1>Fresh fish.<br /><em>Delivered fresh.</em></h1>
      <p>Hilsa, rohu, katla and prawns,<br />delivered across Kolkata.</p>
      <div class="row">
        <span class="pill">fishto.in</span>
        <span class="since">Trusted since 2022</span>
      </div>
    </div>
    <img class="icon" src="../frontend/public/logo-mark.svg" alt="" />
  </div>
</body>
</html>
